name: Passby
options:
  bundleIdPrefix: com.passbyplaza
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 62GLRR66AN
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
packages:
  PassbyCore:
    path: PassbyCore
targets:
  Passby:
    type: application
    platform: iOS
    sources:
      - App/Passby
      - App/Shared
    dependencies:
      - package: PassbyCore
      - target: PassbyLive
    info:
      path: App/Passby/Info.plist
      properties:
        CFBundleDisplayName: Passby
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Light
        UIRequiresFullScreen: true
        NSBluetoothAlwaysUsageDescription: Passby uses Bluetooth to notice other people with the app when you walk past them.
        UIBackgroundModes: [bluetooth-central, bluetooth-peripheral]
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.passbyplaza.app
            CFBundleURLSchemes: [passby]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.passbyplaza.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  PassbyLive:
    type: app-extension
    platform: iOS
    sources:
      - App/PassbyLive
      - App/Shared
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: WidgetKit.framework
    info:
      path: App/PassbyLive/Info.plist
      properties:
        CFBundleDisplayName: Passby
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.passbyplaza.app.live
